<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Thanh Truyền</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c030c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#fff4f0;color:#a44f70;z-index:2}
#loading .heart{font-size:48px;color:#ff4d94;animation:p 1s ease-in-out infinite}
#loading .txt{margin-top:10px;font-size:14px;opacity:.75}
@keyframes p{50%{transform:scale(1.14)}}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0c030c;visibility:hidden}
</style>
</head>
<body>
<div id="loading"><div><div class="heart">♥</div><div class="txt">Đang mở món quà...</div></div></div>
<iframe id="app" title="Happy Birthday Thanh Truyền" allow="autoplay; fullscreen"></iframe>
<script>
(async()=>{
  const files=Array.from({length:9},(_,i)=>`site/p${String(i).padStart(2,'0')}.txt`);
  try{
    const chunks=[];
    for(const f of files){
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(f);
      chunks.push(await r.text());
    }
    const html=chunks.join('');
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      document.getElementById('loading').style.display='none';
      frame.style.visibility='visible';
    },{once:true});
    frame.srcdoc=html;
  }catch(e){
    document.getElementById('loading').innerHTML='<div style="padding:24px">Không tải được trang. Hãy tải lại sau vài giây.</div>';
  }
})();
</script>
</body>
</html>
