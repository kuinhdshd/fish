name: Assemble clean birthday music

on:
  push:
    branches: [main]
    paths:
      - 'assets/musicb64/**'
      - '.github/workflows/assemble-clean-music.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble exact MP3
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d assets/musicb64 ]; then
            echo "No clean music chunks to assemble"
            exit 0
          fi
          cat assets/musicb64/part*.b64 | base64 -d > assets/birthday_music_clean.mp3
          test "$(wc -c < assets/birthday_music_clean.mp3)" = "434511"
          echo "c9f1c8ea295b3a78991b43fae83d9190f7f13da6175d4b152d35d5743c01d19f  assets/birthday_music_clean.mp3" | sha256sum -c -
          rm -rf assets/musicb64
      - name: Commit assembled MP3
        shell: bash
        run: |
          if git diff --quiet -- assets/birthday_music_clean.mp3 assets/musicb64; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/birthday_music_clean.mp3 assets/musicb64
          git commit -m "Assemble verified clean birthday music"
          git push
